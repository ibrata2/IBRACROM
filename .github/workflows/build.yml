name: Build IBRA CROM

# كل رفع على main يبني ملف التنصيب على ويندوز وينشره كإصدار باسم رقم النسخة في package.json
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Latest IBDM Pro extension (from ibrata2/ibdm-pro releases)
        run: node scripts/update-builtin-ibdm.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bundle Tor + ad-block engine + dangerous-sites database
        run: node scripts/prepare-vendor.js --tor --require-tor
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-CROM-Setup
          path: dist/*.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: IBRA CROM v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            IBRA CROM — متصفح مبني على Chromium مع دعم إضافات سوق Chrome، IBDM Pro مدمج، بروكسي لكل لسان (Tor)، حاجب إعلانات، وفاحص فيروسات المواقع.
            برمجة و تطوير ابراهيم الخزرجي
          files: |
            dist/*.exe
            dist/*.blockmap
