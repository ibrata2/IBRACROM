<!doctype html>
<html lang="ar" dir="rtl" data-theme="glass">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: crx:; img-src * data: blob: file: crx:; style-src 'self' 'unsafe-inline' file:; font-src file: data:; script-src 'self' file: 'unsafe-inline'">
<title>IBRA CROM</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="browser.css">
</head>
<body>
<div id="frame">
  <div id="tabstrip">
    <div class="brand" title="IBRA CROM — برمجة و تطوير ابراهيم الخزرجي"><img src="../assets/logo64.png" alt=""></div>
    <div id="tabs" role="tablist"></div>
    <button id="newtab" class="ibtn" title="علامة تبويب جديدة (Ctrl+T)"></button>
    <button id="closedbtn" class="ibtn" title="العلامات المغلقة مؤخراً — اضغط لإعادة فتحها (Ctrl+Shift+T)"><span class="cnt" hidden></span></button>
    <div class="drag-fill"></div>
  </div>
  <div id="toolbar">
    <button id="back" class="ibtn flip" title="رجوع (Alt+←)"></button>
    <button id="forward" class="ibtn flip" title="تقدم (Alt+→)"></button>
    <button id="reload" class="ibtn" title="إعادة التحميل (F5)"></button>
    <button id="home" class="ibtn" title="الصفحة الرئيسية"></button>
    <div id="omnibox">
      <button id="siteinfo" class="chip" tabindex="-1"></button>
      <input id="address" dir="auto" spellcheck="false" autocomplete="off" placeholder="ابحث في Google أو اكتب عنوان موقع">
      <button id="zoomchip" class="chip zoom" hidden></button>
      <button id="star" class="ibtn small" title="إضافة إشارة مرجعية (Ctrl+D)"></button>
    </div>
    <button id="proxybtn" class="ibtn" title="البروكسي لهذا اللسان فقط (IBRA Proxy)"><span class="pdot" hidden></span></button>
    <button id="shieldbtn" class="ibtn" title="حاجب الإعلانات (IBRA AdBlock)"><span class="badge" hidden></span></button>
    <button id="mediabtn" class="ibtn" title="التحكم في الوسائط" hidden><i class="eq"><b></b><b></b><b></b></i></button>
    <div id="actions-wrap" title="الإضافات">
      <browser-action-list id="actions" alignment="bottom right"></browser-action-list>
    </div>
    <button id="extbtn" class="ibtn" title="الإضافات"></button>
    <button id="dlbtn" class="ibtn" title="التنزيلات" hidden><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/></svg><span class="ic"></span></button>
    <button id="updbtn" class="updpill" hidden></button>
    <button id="menubtn" class="ibtn" title="تخصيص IBRA CROM والتحكم فيه"></button>
  </div>
  <div id="bookmarksbar"></div>
  <div id="findbar" hidden>
    <span class="ic find"></span>
    <input id="findinput" placeholder="بحث في الصفحة" spellcheck="false">
    <span id="findcount">0/0</span>
    <button id="findprev" class="ibtn small" title="السابق"></button>
    <button id="findnext" class="ibtn small" title="التالي"></button>
    <button id="findclose" class="ibtn small" title="إغلاق (Esc)"></button>
  </div>
</div>

<div id="overlay">
  <div id="suggest" class="panel" hidden></div>
  <div id="menu" class="panel" hidden></div>
  <div id="dlpanel" class="panel" hidden></div>
  <div id="closedpanel" class="panel" hidden></div>
  <div id="proxypanel" class="panel fpanel" hidden></div>
  <div id="shieldpanel" class="panel fpanel" hidden></div>
  <div id="updpanel" class="panel fpanel" hidden></div>
  <div id="mediapanel" class="panel" hidden></div>
</div>
<div id="toast" hidden></div>
<script src="../shared/icons.js"></script>
<script src="browser.js"></script>
</body>
</html>
